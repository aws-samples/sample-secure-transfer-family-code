AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Transfer Family + Cognito + GuardDuty Malware Scanning Solution'

Parameters:
  UploadBucketName:
    Type: String
    Description: Name for the upload bucket
    Default: upload-bucket-malware-scan
  
  CleanBucketName:
    Type: String
    Description: Name for the clean files bucket
    Default: clean-bucket-malware-scan
  
  MalwareBucketName:
    Type: String
    Description: Name for the malware files bucket
    Default: malware-bucket-malware-scan
  
  ErrorBucketName:
    Type: String
    Description: Name for the error files bucket
    Default: error-bucket-malware-scan

  SecurityTeamEmail:
    Type: String
    Description: Email address for security team notifications
    Default: security-team@example.com

  VPCFlowLogsLogGroupName:
    Type: String
    Description: VPC Flow Logs Log Group Name
    Default: vpc-flow-logs-malware-scan
    
  VPCFlowLogsRetentionInDays:
    Type: Number
    Description: Number of days to retain VPC Flow Logs
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  # VPC Configuration Parameters
  VpcCIDR:
    Type: String
    Default: "10.0.0.0/16"
    Description: CIDR block for the VPC
  
  PublicSubnet1CIDR:
    Type: String
    Default: "10.0.1.0/24"
    Description: CIDR block for public subnet 1
  
  PublicSubnet2CIDR:
    Type: String
    Default: "10.0.2.0/24"
    Description: CIDR block for public subnet 2
  
  PrivateSubnet1CIDR:
    Type: String
    Default: "10.0.3.0/24"
    Description: CIDR block for private subnet 1
  
  PrivateSubnet2CIDR:
    Type: String
    Default: "10.0.4.0/24"
    Description: CIDR block for private subnet 2

  # IP Set Parameters
  AllowedIPAddresses:
    Type: CommaDelimitedList
    Description: "Comma-separated list of allowed IP addresses or CIDR blocks (e.g., '192.168.1.1/32,10.0.0.0/24')"
    Default: "127.0.0.1/32"

  IPSetAction:
    Type: String
    Description: "Action to take for IPs in the IP set (Allow or Block)"
    Default: "Allow"
    AllowedValues:
      - "Allow"
      - "Block"

  EnableEgressRules:
    Type: String
    Description: "Whether to create egress rules for the same IP addresses"
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

Conditions:
  IsAllowAction: !Equals [!Ref IPSetAction, "Allow"]
  HasAllowedIPs: !Not [!Equals [!Join ["", !Ref AllowedIPAddresses], ""]]

Resources:
  # VPC and Network Resources
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-VPC"

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-IGW"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # Public Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet1CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PublicSubnet1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet2CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PublicSubnet2"

  # Private Subnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet1CIDR
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PrivateSubnet1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet2CIDR
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PrivateSubnet2"

  # NAT Gateway for private subnets
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-NatGateway"

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PublicRouteTable"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PrivateRouteTable"

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      SubnetId: !Ref PrivateSubnet2
      
  # VPC Flow Logs Resources
  VPCFlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref VPCFlowLogsLogGroupName
      RetentionInDays: !Ref VPCFlowLogsRetentionInDays
      KmsKeyId: !GetAtt KMSEncryptionKey.Arn

  VPCFlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VPCFlowLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${VPCFlowLogsLogGroupName}:*"

  VPCFlowLogs:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt VPCFlowLogsRole.Arn
      LogGroupName: !Ref VPCFlowLogsLogGroupName
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      MaxAggregationInterval: 60
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-VPC-FlowLogs"

  # VPC Endpoints
  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref VPC
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - "s3:*"
            Resource:
              - "*"

  # SNS VPC Endpoint
  SNSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for SNS VPC endpoint
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCIDR
          Description: Allow connectivity over 443 port
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCIDR
          Description: Allow connectivity over 443 port
  SNSVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sns"
      VpcEndpointType: Interface
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref SNSSecurityGroup
      PrivateDnsEnabled: true

  TransferSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for AWS Transfer Family with allowed IPs
      VpcId: !Ref VPC
      # Empty ingress rules - will be added by the custom resource

  # Custom resource to add security group ingress rules
  SecurityGroupIngressFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt SecurityGroupRulesFunctionRole.Arn
      Runtime: python3.12
      Timeout: 300
      ReservedConcurrentExecutions: 2
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2      
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          import logging
          
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          
          def handler(event, context):
              logger.info('Received event: %s', json.dumps(event))
              
              # Initialize response
              response_data = {}
              physical_resource_id = event.get('PhysicalResourceId', context.log_stream_name)
              
              try:
                  # Get properties from the event
                  props = event['ResourceProperties']
                  security_group_id = props['SecurityGroupId']
                  ip_addresses = props['IPAddresses']
                  port = int(props.get('Port', 22))
                  enable_egress = props.get('EnableEgress', 'false').lower() == 'true'
                  
                  # Initialize EC2 client
                  ec2 = boto3.client('ec2')
                  
                  # Handle create/update events
                  if event['RequestType'] in ['Create', 'Update']:
                      # For update, we need to revoke existing rules first
                      if event['RequestType'] == 'Update' and 'OldResourceProperties' in event:
                          old_ips = event['OldResourceProperties'].get('IPAddresses', [])
                          old_enable_egress = event['OldResourceProperties'].get('EnableEgress', 'false').lower() == 'true'
                          
                          # Revoke old ingress rules
                          for ip in old_ips:
                              try:
                                  ec2.revoke_security_group_ingress(
                                      GroupId=security_group_id,
                                      IpProtocol='tcp',
                                      FromPort=port,
                                      ToPort=port,
                                      CidrIp=ip
                                  )
                                  logger.info(f"Revoked ingress for {ip}")
                              except Exception as e:
                                  logger.warning(f"Error revoking ingress rule for {ip}: {str(e)}")
                          
                          # Revoke old egress rules if they were enabled
                          if old_enable_egress:
                              for ip in old_ips:
                                  try:
                                      ec2.revoke_security_group_egress(
                                          GroupId=security_group_id,
                                          IpPermissions=[
                                              {
                                                  'IpProtocol': 'tcp',
                                                  'FromPort': port,
                                                  'ToPort': port,
                                                  'IpRanges': [{'CidrIp': ip}]
                                              }
                                          ]
                                      )
                                      logger.info(f"Revoked egress for {ip}")
                                  except Exception as e:
                                      logger.warning(f"Error revoking egress rule for {ip}: {str(e)}")
                      
                      # Add new ingress rules
                      for ip in ip_addresses:
                          try:
                              ec2.authorize_security_group_ingress(
                                  GroupId=security_group_id,
                                  IpProtocol='tcp',
                                  FromPort=port,
                                  ToPort=port,
                                  CidrIp=ip
                              )
                              logger.info(f"Authorized ingress for {ip}")
                          except Exception as e:
                              if 'InvalidPermission.Duplicate' in str(e):
                                  logger.info(f"Ingress rule for {ip} already exists")
                              else:
                                  logger.error(f"Error adding ingress rule for {ip}: {str(e)}")
                                  raise
                      
                      # Add new egress rules if enabled
                      if enable_egress:
                          # First, remove the default allow all egress rule
                          try:
                              ec2.revoke_security_group_egress(
                                  GroupId=security_group_id,
                                  IpPermissions=[
                                      {
                                          'IpProtocol': '-1',
                                          'IpRanges': [{'CidrIp': '0.0.0.0/0'}]
                                      }
                                  ]
                              )
                              logger.info("Removed default allow all egress rule")
                          except Exception as e:
                              logger.warning(f"Error removing default egress rule: {str(e)}")
                          
                          # Add specific egress rules
                          for ip in ip_addresses:
                              try:
                                  ec2.authorize_security_group_egress(
                                      GroupId=security_group_id,
                                      IpPermissions=[
                                          {
                                              'IpProtocol': 'tcp',
                                              'FromPort': port,
                                              'ToPort': port,
                                              'IpRanges': [{'CidrIp': ip}]
                                          }
                                      ]
                                  )
                                  logger.info(f"Authorized egress for {ip}")
                              except Exception as e:
                                  if 'InvalidPermission.Duplicate' in str(e):
                                      logger.info(f"Egress rule for {ip} already exists")
                                  else:
                                      logger.error(f"Error adding egress rule for {ip}: {str(e)}")
                                      raise
                  
                  # Handle delete event
                  elif event['RequestType'] == 'Delete':
                      # Revoke ingress rules
                      for ip in ip_addresses:
                          try:
                              ec2.revoke_security_group_ingress(
                                  GroupId=security_group_id,
                                  IpProtocol='tcp',
                                  FromPort=port,
                                  ToPort=port,
                                  CidrIp=ip
                              )
                              logger.info(f"Revoked ingress for {ip}")
                          except Exception as e:
                              logger.warning(f"Error revoking ingress rule for {ip}: {str(e)}")
                      
                      # Revoke egress rules if enabled
                      enable_egress = props.get('EnableEgress', 'false').lower() == 'true'
                      if enable_egress:
                          for ip in ip_addresses:
                              try:
                                  ec2.revoke_security_group_egress(
                                      GroupId=security_group_id,
                                      IpPermissions=[
                                          {
                                              'IpProtocol': 'tcp',
                                              'FromPort': port,
                                              'ToPort': port,
                                              'IpRanges': [{'CidrIp': ip}]
                                          }
                                      ]
                                  )
                                  logger.info(f"Revoked egress for {ip}")
                              except Exception as e:
                                  logger.warning(f"Error revoking egress rule for {ip}: {str(e)}")
                          
                          # Restore default allow all egress rule
                          try:
                              ec2.authorize_security_group_egress(
                                  GroupId=security_group_id,
                                  IpPermissions=[
                                      {
                                          'IpProtocol': '-1',
                                          'IpRanges': [{'CidrIp': '0.0.0.0/0'}]
                                      }
                                  ]
                              )
                              logger.info("Restored default allow all egress rule")
                          except Exception as e:
                              logger.warning(f"Error restoring default egress rule: {str(e)}")
                  
                  response_data['Status'] = 'SUCCESS'
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data, physical_resource_id)
              
              except Exception as e:
                  logger.error('Error: %s', str(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)}, physical_resource_id)

  SecurityGroupRulesFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: EC2SecurityGroupAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DescribeSecurityGroups
                Resource: '*'
              - Effect: Allow
                Action:    
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface                  
                Resource: '*'

  SecurityGroupIngressRules:
    Type: Custom::SecurityGroupIngressRules
    Properties:
      ServiceToken: !GetAtt SecurityGroupIngressFunction.Arn
      SecurityGroupId: !Ref TransferSecurityGroup
      IPAddresses: !Ref AllowedIPAddresses
      Port: 22
      EnableEgress: !Ref EnableEgressRules

  # Lambda Security Group
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          Description: Allow HTTPS connectivity within VPC
          CidrIp: 0.0.0.0/0 

  CloudWatchLogsVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref LambdaSecurityGroup
      PrivateDnsEnabled: true
  # EC2 VPC Endpoint
  EC2EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for SNS VPC endpoint
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCIDR
          Description: Allow connectivity over 443 port
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCIDR
          Description: Allow connectivity over 443 port

  # KMS Key for S3 Encryption
  KMSEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS Key for S3 bucket encryption and Lambda environment variables'
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allowing Cloudwatch Logs to be encrypted
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
            - kms:Encrypt
            - kms:Decrypt
            - kms:ReEncrypt*
            - kms:GenerateDataKey*
            - kms:Describe*
            Resource: "*"
          - Sid: Allow Lambda to use the key for environment variables
            Effect: Allow
            Principal:
              Service: !Sub 'lambda.amazonaws.com'
            Action:
            - kms:Encrypt
            - kms:Decrypt
            - kms:ReEncrypt*
            - kms:GenerateDataKey*
            - kms:Describe*
            Resource: "*"
            
  KMSKeyAlias:
    Type: 'AWS::KMS::Alias'
    Properties:
      AliasName: alias/TransferFamily-KMS-Key
      TargetKeyId: !Ref KMSEncryptionKey

  # S3 Buckets
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${UploadBucketName}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KMSEncryptionKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref UploadAccessLoggingBucket
        LogFilePrefix: "bucket-access-logs/"

  # Log bucket to store access logs
  UploadAccessLoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${UploadBucketName}-access-logs-${AWS::AccountId}'
      # VersioningConfiguration:
      #   Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms  # Using S3-managed keys for logs is common practice
              KMSMasterKeyID: !Ref KMSEncryptionKey              
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: LogRetentionRule
            Status: Enabled
            ExpirationInDays: 90  # Retain logs for 90 days
            NoncurrentVersionExpirationInDays: 30  # Delete old versions after 30 days
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: LogTransitionRule
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 60
                StorageClass: GLACIER

  UploadAccessLoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadAccessLoggingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSLogDeliveryWrite
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub 'arn:aws:s3:::${UploadAccessLoggingBucket}/bucket-access-logs/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !Sub 'arn:aws:s3:::${UploadAccessLoggingBucket}'
              - !Sub 'arn:aws:s3:::${UploadAccessLoggingBucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false
    DependsOn: UploadAccessLoggingBucket

  CleanBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${CleanBucketName}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KMSEncryptionKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref CleanAccessLoggingBucket
        LogFilePrefix: "bucket-access-logs/"
      # Added lifecycle configuration
      LifecycleConfiguration:
        Rules:
          - Id: DataRetentionRule
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90  # Delete old versions after 90 days
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: DataTransitionRule
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA  # Move to infrequent access after 30 days
              - TransitionInDays: 90
                StorageClass: INTELLIGENT_TIERING  # Move to intelligent tiering after 90 days
              - TransitionInDays: 180
                StorageClass: GLACIER  # Archive after 180 days
          - Id: DeleteMarkerCleanup
            Status: Enabled
            ExpiredObjectDeleteMarker: true

  # Log bucket to store access logs
  CleanAccessLoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${CleanBucketName}-access-logs-${AWS::AccountId}'
      # VersioningConfiguration:
      #   Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms  # Using S3-managed keys for logs is common practice
              KMSMasterKeyID: !Ref KMSEncryptionKey              
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: LogRetentionRule
            Status: Enabled
            ExpirationInDays: 90  # Retain logs for 90 days
            NoncurrentVersionExpirationInDays: 30  # Delete old versions after 30 days
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: LogTransitionRule
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 60
                StorageClass: GLACIER

  CleanAccessLoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CleanAccessLoggingBucket
      PolicyDocument:
        Version: '2012-10-17'
