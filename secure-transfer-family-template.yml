  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'SFTPUserPool-${AWS::AccountId}'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UsernameAttributes: []
      UsernameConfiguration:
        CaseSensitive: false      
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true                  
      MfaConfiguration: "OFF"
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
          - Name: verified_phone_number
            Priority: 2

  # Cognito User Pool Client
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub 'SFTPClient-${AWS::AccountId}'
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # IAM Role for Transfer Family
  TransferLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: transfer.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSTransferLoggingAccess

  TransferUserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-TransferUserRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: transfer.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TransferS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub 'arn:aws:s3:::${UploadBucketName}-${AWS::AccountId}'
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:aws:s3:::${UploadBucketName}-${AWS::AccountId}/*'
        - PolicyName: TransferKMSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt KMSEncryptionKey.Arn

  # Authentication Lambda Function
  AuthLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:AdminGetUser
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action:    
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface                  
                Resource: '*'

  AuthLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: "Auth Lambda Function for Transfer Family SFTP Server"
      Handler: index.handler
      Role: !GetAtt AuthLambdaRole.Arn
      Runtime: python3.12
      Timeout: 30
      ReservedConcurrentExecutions: 2
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2      
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          CLIENT_ID: !Ref UserPoolClient
          UPLOAD_BUCKET: !Sub '${UploadBucketName}-${AWS::AccountId}'
          AWS_ACCOUNT_ID: !Ref 'AWS::AccountId'
          AWS_STACK_NAME: !Ref 'AWS::StackName'
      KmsKeyArn: !GetAtt KMSEncryptionKey.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import copy
          
          cognito = boto3.client('cognito-idp')
          def handler(event, context):
              
              username = event.get('username')
              password = event.get('password', '')
              
              if not username:
                  print("No username provided")
                  return {}
              
              # Handle password authentication
              if password:
                  try:
                      print(f"Attempting authentication for user: {username}")
                      
                      # Authenticate user against Cognito
                      response = cognito.admin_initiate_auth(
                          UserPoolId=os.environ['USER_POOL_ID'],
                          ClientId=os.environ['CLIENT_ID'],
                          AuthFlow='ADMIN_NO_SRP_AUTH',
                          AuthParameters={
                              'USERNAME': username,
                              'PASSWORD': password
                          }
                      )
                      
                      print(f"Authentication successful for user: {username}")
                      
                      # Return Transfer Family compatible response
                      auth_response = {
                          'Role': f"arn:aws:iam::{os.environ['AWS_ACCOUNT_ID']}:role/{os.environ['AWS_STACK_NAME']}-TransferUserRole",
                          'HomeDirectory': f"/{os.environ['UPLOAD_BUCKET']}"
                      }
                      
                      print(f"Returning auth response: {json.dumps(auth_response)}")
                      return auth_response
                      
                  except cognito.exceptions.NotAuthorizedException:
                      print(f"Invalid credentials for user: {username}")
                      return {}
                  except cognito.exceptions.UserNotFoundException:
                      print(f"User not found: {username}")
                      return {}
                  except Exception as e:
                      print(f"Authentication error")
                      return {}
              
              # Handle public key authentication (return empty for now)
              else:
                  print(f"Public key authentication not supported for user: {username}")
                  return {}

  # Elastic IPs for Transfer Family
  TransferEIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  TransferEIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  # AWS Transfer Family SFTP Server
  TransferServer:
    Type: AWS::Transfer::Server
    Properties:
      EndpointType: VPC
      EndpointDetails:
